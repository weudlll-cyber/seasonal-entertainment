# ============================================================
# File:        ci.yml
# Path:        .github/workflows/ci.yml
# Project:     Seasonal Entertainment
# Description: CI: runs `npm run verify` (lint, format check, server and client tests, build,
#              browser tests) on pushes to master and on pull requests against master.
#              It calls the same script as local work, so both always run the same checks.
# ============================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify
