# ============================================================
# File:        ci.yml
# Path:        .github/workflows/ci.yml
# Project:     Seasonal Entertainment
# Description: CI: runs `npm run verify` (lint, format check, shared, server and client tests,
#              build, browser tests) on pushes to master and on pull requests against master.
#              It calls the same script as local work, so both always run the same checks.
#              The browser tests start their own call server: the pinned LiveKit binary,
#              downloaded and checked against its SHA-256 first (scripts/calls-binary.mjs).
#              When a browser test fails, its traces and screenshots (test-results/) are
#              uploaded as an artefact, kept 7 days.
#              A second job builds the production image (deploy/site/Dockerfile; never pushed)
#              and checks the compose files and Caddyfiles, so the deployment files cannot rot;
#              it also decrypts an encrypted backup with the real age tool, runs the PC-side
#              tests (deploy/pc/: PowerShell for Windows, POSIX sh for Linux and macOS), the
#              installer's token, Discord, update-copy, hardening and embedded-games tests
#              (deploy/test/bot-admin-token.test.sh, deploy/test/discord.test.sh,
#              deploy/test/update-copy.test.sh, deploy/test/server-hardening.test.sh,
#              deploy/test/games.test.sh) and
#              shellcheck over the installer, its tests and the PC-side shell scripts
#              (deploy/install.sh, deploy/install/, deploy/test/, deploy/pc/).
# ============================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Get the pinned LiveKit binary (checksum-checked)
        run: node scripts/calls-binary.mjs

      - name: Verify
        run: npm run verify

      # Only a failed browser test leaves a trace or a screenshot (playwright.config.js, on CI
      # only), so a failure elsewhere uploads nothing.
      - name: Upload the failed browser tests' traces and screenshots
        if: failure() && hashFiles('test-results/**/*.zip', 'test-results/**/*.png') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  deploy-files:
    name: deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the site image (no push)
        run: >-
          docker build -f deploy/site/Dockerfile --build-arg COMMIT_SHA=${{ github.sha }}
          -t seasonal-site:ci .

      - name: The image starts in production and answers /api/health
        run: |
          docker run -d --name site -p 127.0.0.1:3800:3800 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" -e TRUST_PROXY=1 \
            -e SECRET_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PUBLIC_ORIGIN=https://site.example seasonal-site:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3800/api/health && exit 0; sleep 1; done
          docker logs site
          exit 1

      - name: The built client carries the commit /api/health reports (the update notice)
        run: |
          commit=$(curl -sf http://127.0.0.1:3800/api/health | jq -r .commit)
          test "$commit" = "$(echo '${{ github.sha }}' | cut -c1-12)"
          docker exec site grep -rqF "$commit" client/dist/assets

      - name: An encrypted backup decrypts with the age tool and passes the restore check
        run: |
          sudo apt-get install -y age > /dev/null
          age-keygen -o key.txt 2> /dev/null
          docker exec -e BACKUP_RECIPIENT="$(age-keygen -y key.txt)" site node scripts/backup.mjs
          name=$(docker exec site sh -c 'ls /backups')
          docker cp "site:/backups/$name" backup.tar.age
          age -d -i key.txt -o backup.tar backup.tar.age
          tar -tf backup.tar | grep -q '/seasonal.db$'
          docker cp backup.tar site:/tmp/backup.tar
          docker exec site node scripts/restore.mjs /tmp/backup.tar --check

      - name: The PC side of the backups (PowerShell)
        run: pwsh -NoProfile -File deploy/pc/SeasonalBackups.Tests.ps1

      - name: The PC side of the backups (Linux and macOS, POSIX sh)
        run: sh deploy/pc/get-seasonal-backups.test.sh

      - name: The installer reads the event bot's token as systemd does, and nginx can carry it
        run: bash deploy/test/bot-admin-token.test.sh

      - name: The installer takes the Discord login's settings, never showing the secret
        run: bash deploy/test/discord.test.sh

      - name: Without backups, --update keeps a root-only local copy (the newest three)
        run: bash deploy/test/update-copy.test.sh

      - name: The installer prepares the embedded games (questions, routes, feeds denied, token)
        run: bash deploy/test/games.test.sh

      # As root, so the backup folder's rules are also tried for real.
      - name: The installer's hardening (bot page headers, logs, LiveKit, checkout, backup folder)
        run: sudo bash deploy/test/server-hardening.test.sh

      - name: Compose files are valid
        run: |
          cp .env.example deploy/site/site.env
          printf 'SITE_DOMAIN=site.example\nCALLS_DOMAIN=calls.example\nACME_EMAIL=ops@site.example\n' > deploy/site/.env
          docker compose -f deploy/site/docker-compose.yml config --quiet
          printf 'LIVEKIT_KEYS=k: s\nCALLS_DOMAIN=calls.example\nCALLS_CERT_DIR=/tmp\nACME_EMAIL=ops@site.example\n' > deploy/calls/.env
          docker compose -f deploy/calls/docker-compose.yml --profile proxy config --quiet
          # Call recording: the add-on file together with the main one.
          printf 'LIVEKIT_API_KEY=k\nLIVEKIT_API_SECRET=s\nRECORDINGS_DIR=/tmp\n' >> deploy/calls/.env
          docker compose -f deploy/calls/docker-compose.yml -f deploy/calls/docker-compose.recording.yml config --quiet

      - name: Caddyfiles are valid and formatted
        run: |
          # The pinned image from the compose file's "image:" line, so both always agree.
          image=$(sed -n 's/^ *image: \(caddy:[^ ]*\).*/\1/p' deploy/site/docker-compose.yml | head -1)
          docker run --rm -e SITE_DOMAIN=site.example -e CALLS_DOMAIN=calls.example \
            -e ACME_EMAIL=ops@site.example -e CALLS_UPSTREAM=host.docker.internal:7880 \
            -v "$PWD/deploy/site/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/site/caddy:/etc/caddy/sites:ro" \
            -v "$PWD/deploy/calls/Caddyfile:/etc/caddy/calls-own:ro" \
            -v "$PWD/deploy/install/caddy:/etc/caddy/install-sites:ro" "$image" sh -c '
              caddy validate --config /etc/caddy/Caddyfile &&
              caddy validate --config /etc/caddy/calls-own --adapter caddyfile &&
              for f in /etc/caddy/Caddyfile /etc/caddy/sites/calls.caddy /etc/caddy/calls-own \
                /etc/caddy/install-sites/www.caddy; do
                caddy fmt "$f" | diff -q - "$f" || exit 1
              done'
          # The installer's sites folder (the www redirect) in place of ./caddy.
          docker run --rm -e SITE_DOMAIN=site.example -e ACME_EMAIL=ops@site.example \
            -v "$PWD/deploy/site/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/install/caddy:/etc/caddy/sites:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile

      # The installer, the scripts it runs and its tests (deploy/install.sh, deploy/test/,
      # docs/DEPLOYMENT.md), and the PC side of the backups for Linux and macOS (deploy/pc/).
      - name: Installer scripts pass shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x
          deploy/install.sh deploy/install/lib/*.sh deploy/install/certbot-hook.sh
          deploy/site/calls-cert.sh deploy/test/run.sh deploy/test/checks.sh
          deploy/test/checks-bot-admin.sh deploy/test/bot-admin-token.test.sh
          deploy/test/discord.test.sh deploy/test/update-copy.test.sh
          deploy/test/server-hardening.test.sh deploy/test/games.test.sh
          deploy/test/prepare-nginx.sh deploy/test/prepare-ufw.sh
          deploy/pc/get-seasonal-backups.sh deploy/pc/get-seasonal-backups.test.sh
