# ============================================================
# File:        catch-all.conf
# Path:        deploy/nginx/catch-all.conf
# Project:     Seasonal Entertainment
# Description: An optional nginx server for a host where the installer runs in nginx mode
#              (docs/DEPLOYMENT.md, "Unknown names: a catch-all"): requests for a name no site
#              there serves (by IP address, without a name, or a stranger's name) get no answer
#              at all instead of the distribution's welcome page or another site's certificate.
#              Port 80 on IPv4 and IPv6 and port 443 on IPv4: 444 closes the connection, and on
#              443 the TLS handshake is refused before any certificate is shown. IPv6 443 is left
#              to the installer, which makes such a server there itself where no other site
#              listens. Copy it to /etc/nginx/sites-available/, link it into sites-enabled,
#              remove the link sites-enabled/default (the file stays), then nginx -t and reload.
#              Needs nginx 1.19.4 or newer (ssl_reject_handshake). In use on the owner's server
#              since 2026-11-02.
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
