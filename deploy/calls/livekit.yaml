# ============================================================
# File:        livekit.yaml
# Path:        deploy/calls/livekit.yaml
# Project:     Seasonal Entertainment
# Description: Production configuration of the call service (LiveKit server, pinned in
#              docker-compose.yml). No secrets here: the API key pair comes from the
#              environment (LIVEKIT_KEYS, see docker-compose.yml and .env.example in this
#              folder). Ports, firewall rules and TURN: docs/CALLS.md.
# ============================================================

# Signalling (WebSocket and HTTP API). The reverse proxy terminates TLS for
# wss://<calls domain> and forwards here; the firewall keeps 7880 closed to the outside.
port: 7880

rtc:
  # ICE over TCP for clients whose UDP is blocked.
  tcp_port: 7881
  # Media over UDP. A narrow range (500 ports): up to 250 participants with two peer
  # connections each. Must match the firewall rules in docs/CALLS.md.
  port_range_start: 50000
  port_range_end: 50499
  # The server's public address is discovered (STUN), so the same file works on any VPS.
  use_external_ip: true

# Built-in TURN for clients behind strict firewalls: TURN over TLS on 5349 uses the calls
# domain's certificate (mounted at /certs by docker-compose.yml); TURN over UDP on 3478.
# The domain (it must match the certificate) comes from LIVEKIT_TURN_DOMAIN, so this file
# stays the same on every server.
turn:
  enabled: true
  tls_port: 5349
  udp_port: 3478
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem

room:
  # A room nobody joined is closed after 5 minutes; the site ends calls itself.
  empty_timeout: 300
  # Hard ceiling; the site's own cap (admin setting, default 250) refuses joins earlier.
  max_participants: 1000

logging:
  level: info
