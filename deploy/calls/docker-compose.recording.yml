# ============================================================
# File:        docker-compose.recording.yml
# Path:        deploy/calls/docker-compose.recording.yml
# Project:     Seasonal Entertainment
# Description: Call recording (docs/CALLS.md, "Recording"; docs/DEPLOYMENT.md, "Call
#              recording"): LiveKit's egress service (Apache-2.0) and the Redis it and the
#              LiveKit server talk through, both pinned by tag and digest. Only together with
#              the main file: "docker compose -f docker-compose.yml -f
#              docker-compose.recording.yml up -d". Without it, nothing records and the site
#              hides the button (its CALLS_RECORDINGS_DIR unset). The recordings land in
#              RECORDINGS_DIR on the host, the folder the site reads (its CALLS_RECORDINGS_DIR);
#              inside the egress container it is /recordings (the site's
#              CALLS_EGRESS_OUTPUT_DIR). Keys from ./.env (not committed). Egress gets 3 CPUs and
#              counts a recording at 2.0 of them (cpu_cost), so it accepts one.
# ============================================================

services:
  livekit:
    environment:
      # LiveKit hands recording jobs to the egress service through Redis.
      REDIS_HOST: 127.0.0.1:6379

  redis:
    image: redis:7.4.11-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    restart: unless-stopped
    network_mode: host
    # Only this machine: nothing outside talks to Redis.
    command: ['redis-server', '--bind', '127.0.0.1', '--port', '6379', '--save', '']

  egress:
    image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    restart: unless-stopped
    network_mode: host
    # Chrome inside records the room's layout; it needs this to run its sandbox.
    cap_add: [SYS_ADMIN]
    environment:
      # cpu_cost: egress takes a job only when the job's cost fits its free CPUs, counted from
      # the container's limit below (cpus: 3, all free while idle; 80 % of them, the default
      # max_cpu_utilization, once a job runs). Its default room composite cost is 4, more than
      # the container had: it declined every recording without a word (its "cpu check" is
      # logged at debug) and the site's start request timed out. One recording here is counted
      # at 2.0 instead (1280 x 720, 15 frames a second, server/src/calls/service.js; decided
      # 2026-11-06). logging.level: egress v1.15.0's own key (pkg/config/base.go:43, its
      # BaseConfig.Logging); the "log_level" written here before was no key of it (2026-11-07).
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/calls/.env}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/calls/.env}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        logging:
          level: info
        cpu_cost:
          room_composite_cpu_cost: 2.0
    volumes:
      # The site reads the finished files from the same folder (and backs them up).
      - ${RECORDINGS_DIR:?set RECORDINGS_DIR in deploy/calls/.env}:/recordings
    # A recording is counted at 2.0 CPUs while it runs (Chrome plus the encoder; cpu_cost
    # above); 3 lets egress accept one (2.0 <= 3, and <= 3 x 0.8 = 2.4 with headroom), leaving the
    # VPS's other cores to LiveKit and the site. One recording at a time.
    deploy:
      resources:
        limits:
          cpus: '3'
          # Measured on the VPS: up to 1.79 GB while recording (egress's own "maxMemory",
          # 2026-11-06), too close to the earlier 2G.
          memory: 3G
